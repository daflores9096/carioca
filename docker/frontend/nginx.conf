server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Assets con hash de Vite: cache largo
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA: rutas de Vue Router
    location / {
        try_files $uri $uri/ /index.html;
    }
}
