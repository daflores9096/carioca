name: carioca

services:
  gateway:
    image: nginx:1.27-alpine
    container_name: carioca-app-gateway
    ports:
      - "48080:80"
    volumes:
      - ./docker/gateway/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
      - frontend
    restart: unless-stopped

  api:
    build:
      context: ./docker/php83
    container_name: carioca-app-api
    command: sh -c "composer install --no-interaction --optimize-autoloader && apache2-foreground"
    volumes:
      - ./app:/var/www/html
      - carioca_app_api_vendor:/var/www/html/vendor
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: root
      DB_PASS: root
      DB_NAME: carioca
      APP_ENV: development
      APP_DEBUG: "1"
      CORS_ORIGIN: http://localhost:48080
      SESSION_NAME: CARIOCASESSID
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    image: node:20-alpine
    container_name: carioca-app-frontend
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5173"
    volumes:
      - ./frontend:/app
      - carioca_app_frontend_node_modules:/app/node_modules
    environment:
      # Vacío = mismo origen vía gateway (/api → api)
      VITE_API_BASE_URL: ""
    depends_on:
      - api
    restart: unless-stopped

  db:
    image: mariadb:10.11
    container_name: carioca-app-db
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: carioca
      MARIADB_AUTO_UPGRADE: "1"
    volumes:
      - carioca_app_db_data:/var/lib/mysql
      - ./docker/db/init:/docker-entrypoint-initdb.d
    command:
      - --character-set-server=latin1
      - --collation-server=latin1_swedish_ci
      - --sql-mode=NO_ENGINE_SUBSTITUTION
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

volumes:
  carioca_app_db_data:
  carioca_app_api_vendor:
  carioca_app_frontend_node_modules:
