name: carioca

services:
  gateway:
    image: nginx:1.27-alpine
    container_name: carioca-app-gateway
    ports:
      - "${CARIOCA_PORT:-48080}:80"
    volumes:
      - ./docker/gateway/nginx.prod.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
      - frontend
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: docker/php83/Dockerfile.prod
    image: carioca-api:prod
    container_name: carioca-app-api
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: ${DB_USER:-root}
      DB_PASS: ${DB_PASS:-changeme}
      DB_NAME: ${DB_NAME:-carioca}
      APP_ENV: production
      APP_DEBUG: "0"
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:48080}
      APP_URL: ${APP_URL:-}
      SESSION_NAME: ${SESSION_NAME:-CARIOCASESSID}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_ENCRYPTION: ${SMTP_ENCRYPTION:-tls}
      MAIL_FROM: ${MAIL_FROM:-}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-CARIOCA}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
      args:
        VITE_API_BASE_URL: ""
    image: carioca-frontend:prod
    container_name: carioca-app-frontend
    restart: unless-stopped

  db:
    image: mariadb:10.11
    container_name: carioca-app-db
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASS:-changeme}
      MYSQL_DATABASE: ${DB_NAME:-carioca}
      MARIADB_AUTO_UPGRADE: "1"
    volumes:
      - carioca_app_db_data:/var/lib/mysql
      - ./docker/db/init:/docker-entrypoint-initdb.d:ro
    command:
      - --character-set-server=latin1
      - --collation-server=latin1_swedish_ci
      - --sql-mode=NO_ENGINE_SUBSTITUTION
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

volumes:
  carioca_app_db_data:
